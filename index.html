<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>오늘의 할 일</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body class="min-w-[320px] min-h-screen bg-slate-50 text-slate-800">
    <main class="mx-auto w-full max-w-3xl px-4 py-8 sm:px-6 sm:py-12">
      <section class="overflow-hidden rounded-3xl bg-white shadow-xl shadow-slate-200/70" aria-labelledby="page-title">
        <div class="p-6 sm:p-10">
          <header class="mb-8">
            <p class="mb-2 text-sm font-bold tracking-wide text-violet-600">하루를 가볍게 정리해요</p>
            <h1 id="page-title" class="mb-2 text-3xl font-extrabold tracking-tight text-slate-900 sm:text-4xl">오늘의 할 일</h1>
            <p class="text-sm leading-6 text-slate-500 sm:text-base">작은 한 걸음부터 차근차근 완성해 보세요.</p>
          </header>

          <form id="todo-form" class="mb-7" novalidate>
            <label for="todo-input" class="mb-2 block text-sm font-semibold text-slate-700">새로운 할 일</label>
            <div class="flex flex-col gap-2 sm:flex-row">
              <input
                id="todo-input"
                class="min-w-0 flex-1 rounded-xl border border-slate-300 bg-white px-4 py-3 text-base text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-violet-500 focus:ring-4 focus:ring-violet-100"
                type="text"
                placeholder="예: 산책하며 좋아하는 음악 듣기"
                autocomplete="off"
                aria-describedby="input-feedback storage-feedback"
              >
              <button class="rounded-xl bg-violet-600 px-6 py-3 font-semibold text-white transition hover:bg-violet-700 focus:outline-none focus:ring-4 focus:ring-violet-200" type="submit">
                추가
              </button>
            </div>
            <p id="input-feedback" class="mt-2 text-sm text-red-600" role="alert" hidden></p>
            <p id="storage-feedback" class="mt-2 text-sm text-slate-500" role="status" aria-live="polite" hidden></p>
          </form>

          <section class="mb-8 rounded-2xl bg-violet-50 p-4 sm:p-5" aria-labelledby="progress-title">
            <div class="mb-3 flex items-end justify-between gap-3">
              <div>
                <h2 id="progress-title" class="mb-1 text-sm font-bold text-slate-800">오늘의 진행률</h2>
                <p id="remaining-count" class="text-sm text-slate-500">남은 할 일 0개</p>
              </div>
              <p id="progress-label" class="text-2xl font-extrabold text-violet-700" aria-live="polite">0%</p>
            </div>
            <div class="h-2.5 overflow-hidden rounded-full bg-violet-100" role="progressbar" aria-label="전체 할 일 완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <div id="progress-bar" class="h-full w-0 rounded-full bg-violet-600 transition-[width] duration-300"></div>
            </div>
          </section>

          <section aria-labelledby="list-title">
            <div class="mb-3 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
              <h2 id="list-title" class="text-lg font-bold text-slate-900">할 일 목록</h2>
              <div class="flex w-full rounded-xl border border-slate-200 bg-white p-1 sm:w-auto" role="group" aria-label="할 일 필터">
                <button class="filter-button flex-1 rounded-lg px-3 py-2 text-sm font-medium transition sm:flex-none" type="button" data-filter="all" aria-pressed="true">전체</button>
                <button class="filter-button flex-1 rounded-lg px-3 py-2 text-sm font-medium transition sm:flex-none" type="button" data-filter="pending" aria-pressed="false">진행 중</button>
                <button class="filter-button flex-1 rounded-lg px-3 py-2 text-sm font-medium transition sm:flex-none" type="button" data-filter="completed" aria-pressed="false">완료</button>
              </div>
            </div>

            <ul id="todo-list" class="divide-y divide-slate-100" aria-live="polite" aria-relevant="additions removals text"></ul>
            <div id="empty-state" class="rounded-2xl border border-dashed border-slate-200 bg-slate-50 px-4 py-10 text-center">
              <span class="mb-3 inline-flex h-12 w-12 items-center justify-center rounded-full bg-violet-100 text-xl font-bold text-violet-600" aria-hidden="true">✓</span>
              <p id="empty-message" class="text-sm leading-6 text-slate-500">등록된 할 일이 없습니다. 새로운 할 일을 추가해보세요!</p>
            </div>
          </section>
        </div>
      </section>
      <p class="mt-5 text-center text-xs text-slate-400">오늘도 충분히 잘하고 있어요.</p>
    </main>

    <template id="todo-template">
      <li class="todo-item flex items-start gap-3 py-4">
        <input class="todo-checkbox mt-1 h-5 w-5 shrink-0 cursor-pointer accent-violet-600" type="checkbox">
        <span class="todo-text min-w-0 flex-1 whitespace-pre-wrap break-words text-sm leading-6 text-slate-700"></span>
        <button class="todo-delete shrink-0 rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-500 transition hover:bg-red-50 hover:text-red-600 focus:outline-none focus:ring-2 focus:ring-red-200" type="button">삭제</button>
      </li>
    </template>
  </body>
</html>
