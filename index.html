<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>오늘의 할 일</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container todo-shell py-4 py-md-5">
      <section class="todo-card card border-0 shadow-sm mx-auto" aria-labelledby="page-title">
        <div class="card-body p-4 p-md-5">
          <header class="mb-4">
            <p class="eyebrow mb-2">하루를 가볍게 정리해요</p>
            <h1 id="page-title" class="display-6 fw-bold mb-2">오늘의 할 일</h1>
            <p class="text-secondary mb-0">작은 한 걸음부터 차근차근 완성해 보세요.</p>
          </header>

          <form id="todo-form" class="mb-4" novalidate>
            <label for="todo-input" class="form-label fw-semibold">새로운 할 일</label>
            <div class="input-group input-group-lg">
              <input
                id="todo-input"
                class="form-control"
                type="text"
                placeholder="예: 산책하며 좋아하는 음악 듣기"
                autocomplete="off"
                aria-describedby="input-feedback storage-feedback"
              >
              <button class="btn btn-primary px-4" type="submit">추가</button>
            </div>
            <p id="input-feedback" class="form-text text-danger mb-0 mt-2" role="alert" hidden></p>
            <p id="storage-feedback" class="form-text mb-0 mt-2" role="status" aria-live="polite" hidden></p>
          </form>

          <section class="progress-panel rounded-4 p-3 p-md-4 mb-4" aria-labelledby="progress-title">
            <div class="d-flex justify-content-between align-items-end gap-3 mb-3">
              <div>
                <h2 id="progress-title" class="h6 fw-bold mb-1">오늘의 진행률</h2>
                <p id="remaining-count" class="small text-secondary mb-0">남은 할 일 0개</p>
              </div>
              <p id="progress-label" class="progress-value fw-bold mb-0" aria-live="polite">0%</p>
            </div>
            <div
              class="progress"
              role="progressbar"
              aria-label="전체 할 일 완료율"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
            </div>
          </section>

          <section aria-labelledby="list-title">
            <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-3">
              <h2 id="list-title" class="h5 fw-bold mb-0">할 일 목록</h2>
              <div class="filter-group btn-group" role="group" aria-label="할 일 필터">
                <button class="btn btn-sm btn-outline-secondary active" type="button" data-filter="all" aria-pressed="true">전체</button>
                <button class="btn btn-sm btn-outline-secondary" type="button" data-filter="pending" aria-pressed="false">진행 중</button>
                <button class="btn btn-sm btn-outline-secondary" type="button" data-filter="completed" aria-pressed="false">완료</button>
              </div>
            </div>

            <ul id="todo-list" class="list-group list-group-flush" aria-live="polite" aria-relevant="additions removals text"></ul>
            <div id="empty-state" class="empty-state text-center rounded-4 px-3 py-5">
              <span class="empty-icon d-inline-flex align-items-center justify-content-center rounded-circle mb-3" aria-hidden="true">✓</span>
              <p id="empty-message" class="text-secondary mb-0">등록된 할 일이 없습니다. 새로운 할 일을 추가해보세요!</p>
            </div>
          </section>
        </div>
      </section>
      <p class="text-center text-secondary small mt-4 mb-0">오늘도 충분히 잘하고 있어요.</p>
    </main>
  </body>
</html>
